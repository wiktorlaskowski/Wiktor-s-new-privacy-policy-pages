<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Forkphorus Button for Scratch — Privacy</title>
  <style>
    :root { --maxw: 1100px; --radius: 10px; --shadow: 0 1px 3px rgba(0,0,0,.08), 0 6px 20px rgba(0,0,0,.06); }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Arial, sans-serif; color: #111; background: #fafafa; }
    header { background: #fff; border-bottom: 1px solid #e6e6e6; }
    .wrap { max-width: var(--maxw); margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 8px; font-size: 28px; line-height: 1.2; }
    article { background: #fff; border: 1px solid #e8e8e8; border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; margin-top: 20px; }
    p { margin: 0; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Forkphorus Button for Scratch — Privacy</h1>
    </div>
  </header>

  <main class="wrap">
    <h2>Tracking — None</h2>
    <article>
      <p>This extension only adds a button that redirects. It's not used to sell permissions to me.</p>
    </article>
  </main>
</body>
</html>
